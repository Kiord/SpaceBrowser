name: Release

on:
  push:
    tags:
      - "v*.*.*" 

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Linux GUI deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Prepare icons
        shell: bash
        run: |
          mkdir -p build build/windows
          [ -f assets/appicon.png ]  && cp assets/appicon.png  build/appicon.png
          [ -f assets/appicon.icns ] && cp assets/appicon.icns build/appicon.icns
          [ -f assets/appicon.ico ]  && cp assets/appicon.ico  build/windows/icon.ico

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python -c 'import json, pathlib, sys; path = pathlib.Path("wails.json"); config = json.loads(path.read_text()); config["info"]["productVersion"] = sys.argv[1]; path.write_text(json.dumps(config, indent=2) + "\n")' "$VERSION"

      - name: Build Wails app
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            wails build -trimpath -tags webkit2_41 -windowsconsole
          else
            wails build -trimpath -tags webkit2_41
          fi
        shell: bash

      - name: Package artifact
        id: pkg
        shell: bash
        run: |
          VERSION="${GITHUB_REF##*/}"
          NAME="SpaceBrowser"
          case "${{ matrix.os }}" in
            windows-latest)
              SRC="build/bin/spacebrowser.exe"
              OUT="${NAME}-${VERSION}-windows-x64.exe"
              cp "$SRC" "$OUT"
              ;;
            macos-latest)
              SRC="build/bin/SpaceBrowser.app"
              OUT="${NAME}-${VERSION}-macOS.zip"
              ditto -c -k --sequesterRsrc --keepParent "$SRC" "$OUT"
              ;;
            ubuntu-latest)
              SRC="build/bin/spacebrowser"
              OUT="${NAME}-${VERSION}-linux-x64"
              cp "$SRC" "$OUT"
              chmod +x "$OUT"
              ;;
          esac
          echo "artifact=$OUT" >> $GITHUB_OUTPUT

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pkg.outputs.artifact }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
