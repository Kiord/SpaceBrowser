name: Test

on:
  workflow_call:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libglib2.0-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev

      - name: Run Go vet
        run: go vet ./...

      - name: Validate JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem web -Recurse -Filter '*.js' | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Test frontend behavior
        run: node --experimental-vm-modules --test --test-timeout=10000 tests/*.test.mjs

      - name: Run tests
        if: runner.os == 'macOS'
        run: go test ./...

      - name: Run tests with mapped-drive integration
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $shareName = 'SpaceBrowserTest'
          $sharePath = Join-Path $env:RUNNER_TEMP 'spacebrowser-network-share'
          $account = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          New-Item -ItemType Directory -Path $sharePath -Force | Out-Null
          New-SmbShare -Name $shareName -Path $sharePath -FullAccess $account | Out-Null
          try {
            New-SmbMapping -LocalPath 'Z:' -RemotePath "\\localhost\$shareName" -Persistent $false | Out-Null
            $env:SPACEBROWSER_TEST_MAPPED_DRIVE = 'Z:\'
            go test ./...
            if ($LASTEXITCODE -ne 0) { throw "go test failed with exit code $LASTEXITCODE" }
          } finally {
            Remove-SmbMapping -LocalPath 'Z:' -Force -UpdateProfile -ErrorAction SilentlyContinue
            Remove-SmbShare -Name $shareName -Force -ErrorAction SilentlyContinue
          }

      - name: Run tests with race detector
        if: runner.os == 'Linux'
        run: go test -race -tags webkit2_41 ./...

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0

      - name: Build Wails app
        run: wails build -trimpath -tags webkit2_41

      - name: Test Linux setup in an isolated home
        if: runner.os == 'Linux'
        run: bash tests/installer.test.sh

      - name: Validate macOS setup files
        if: runner.os == 'macOS'
        run: |
          bash -n packaging/macos/Install.command
          plutil -lint packaging/macos/ScanWithSpaceBrowser.workflow/Contents/Info.plist
          plutil -lint packaging/macos/ScanWithSpaceBrowser.workflow/Contents/document.wflow

      - name: Setup .NET for installer validation
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and validate Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.6
          wix extension add -g WixToolset.UI.wixext/4.0.6
          wix extension add -g WixToolset.Util.wixext/4.0.6
          wix build packaging/windows/SpaceBrowser.wxs packaging/windows/SetupUI.wxs `
            -arch x64 -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext `
            -d AppVersion=0.0.0 -d ExecutablePath=build/bin/spacebrowser.exe `
            -d IconPath=assets/appicon.ico -o build/bin/SpaceBrowser.msi
