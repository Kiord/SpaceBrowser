<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpaceBrowser</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="./app.js"></script>
</head>

<body>
  <div class="container">
    <div class="controls" id="topbar">
      <div class="input-group" id="pathGroup">
        <button type="button" class="browse-button" id="triggerFolderSelectButton" aria-label="Browse for folder" data-tooltip="Choose folder">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 8V5h7l2 3h9v11H3z"></path>
            <path d="M3 9h18"></path>
          </svg>
        </button>

        <input type="text" id="pathInput" placeholder="Select or paste a folder path…" />
        <button id="analyzeButton" aria-label="Scan folder" data-tooltip="Scan folder">Scan</button>
        <input type="file" id="folderInput" webkitdirectory directory multiple style="display:none" />
      </div>

      <div class="right-group" aria-label="Treemap navigation">
        <button class="nav-button" id="backwardButton" type="button" aria-label="Back" data-tooltip="Back · Alt+Left · Mouse Back" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19 12H5"></path>
            <path d="m10 7-5 5 5 5"></path>
          </svg>
        </button>
        <button class="nav-button" id="forwardButton" type="button" aria-label="Forward" data-tooltip="Forward · Alt+Right · Mouse Forward" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14"></path>
            <path d="m14 7 5 5-5 5"></path>
          </svg>
        </button>
        <button class="nav-button" id="parentButton" type="button" aria-label="Go to parent" data-tooltip="Go to parent folder" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 19V5"></path>
            <path d="m7 10 5-5 5 5"></path>
          </svg>
        </button>
        <button class="nav-button home-button" id="rootButton" type="button" aria-label="Go to scan root" data-tooltip="Go to scan root" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 11.2 12 4l9 7.2"></path>
            <path d="M5.5 10.2V20h13v-9.8"></path>
            <path d="M9.5 20v-6h5v6"></path>
          </svg>
        </button>
        <span class="control-separator" aria-hidden="true"></span>
        <button class="toggle-button" id="toggleFreeSpaceButton" type="button" aria-pressed="true" data-tooltip="Show or hide available disk space">Free space</button>
        <button class="nav-button" id="settingsButton" type="button" aria-label="Scan settings" data-tooltip="Scan settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.09a2 2 0 0 1 1 1.73v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.51a2 2 0 0 1 1-1.73l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>
    </div>
    
    <canvas id="colorCanvas"></canvas>
    <canvas id="idCanvas" style="display: none"></canvas>
    <canvas id="tmpCanvas" style="display: none"></canvas>
    <canvas id="maskCanvas" style="display: none"></canvas>
    
  </div>
  <ul id="contextMenu" class="context-menu">
    <li data-action="goto">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="10.5" cy="10.5" r="5.5"></circle>
        <path d="m15 15 5 5"></path>
      </svg>
      <span>Go to</span>
    </li>
    <li data-action="open">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 8V5h7l2 3h9v11H3z"></path>
        <path d="M3 9h18"></path>
      </svg>
      <span>Open in file browser</span>
    </li>
    <li data-action="copy">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="8" y="7" width="11" height="13"></rect>
        <path d="M16 7V4H5v13h3"></path>
      </svg>
      <span>Copy path</span>
    </li>
  </ul>

  <div id="toast">Copied path</div>  

  <dialog id="settingsDialog" class="settings-dialog" aria-labelledby="settingsTitle">
    <form id="settingsForm">
      <header class="settings-header">
        <h2 id="settingsTitle">Settings</h2>
        <button class="dialog-icon-button" id="closeSettingsButton" type="button" aria-label="Close settings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12M18 6 6 18"></path>
          </svg>
        </button>
      </header>

      <div class="settings-body">
        <div class="settings-row">
          <label>Platform</label>
          <output id="settingsPlatform"></output>
        </div>
        <div class="settings-row settings-row-top">
          <label for="settingsExcludedPaths">Excluded paths</label>
          <div>
            <textarea id="settingsExcludedPaths" rows="5" spellcheck="false" placeholder="One absolute path per line"></textarea>
            <small>One path per line. Subfolders are excluded too.</small>
          </div>
        </div>
        <div class="settings-row">
          <label for="settingsMinFileSize">Small-file threshold</label>
          <div class="number-field">
            <input id="settingsMinFileSize" type="number" min="0" step="any" required>
            <select id="settingsMinFileSizeUnit" aria-label="Small-file threshold unit">
              <option value="B">B</option>
              <option value="KB">KB</option>
              <option value="MB">MB</option>
              <option value="GB">GB</option>
            </select>
          </div>
        </div>
        <label class="settings-check">
          <input id="settingsSkipHidden" type="checkbox">
          <span>Skip hidden files and folders</span>
        </label>
        <label class="settings-check">
          <input id="settingsFollowSymlinks" type="checkbox">
          <span>Follow symbolic links</span>
        </label>
        <label class="settings-check">
          <input id="settingsSkipNetworkFS" type="checkbox">
          <span>Skip network filesystems</span>
        </label>
        <div id="settingsError" class="settings-error" role="alert"></div>
      </div>

      <footer class="settings-actions">
        <button id="cancelSettingsButton" type="button">Cancel</button>
        <button type="submit">Save</button>
      </footer>
    </form>
  </dialog>

  <dialog id="scanDialog" class="scan-dialog" aria-labelledby="scanDialogTitle">
    <div class="scan-dialog-body">
      <div id="scanDialogTitle" class="scan-title">
        <span>Scanning&nbsp;</span><span id="scanQueryPath" class="scan-query-path"></span>
        <span id="scanningDots" class="scanning-dots" aria-hidden="true">.</span>
      </div>
      <div id="scanCurrentPath" class="scan-current-path"></div>
      <div class="scan-progress" role="progressbar" aria-label="Scanning filesystem">
        <div class="scan-progress-bar"></div>
      </div>
      <div class="scan-time">
        <span>Elapsed <strong id="scanElapsedTime">0:00</strong></span>
        <span id="scanEstimate">Estimating remaining time…</span>
      </div>
      <div class="scan-actions">
        <button id="cancelScanButton" type="button">Cancel</button>
      </div>
    </div>
  </dialog>


</body>

</html>
