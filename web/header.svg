
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 650 185"
     role="img"
     aria-labelledby="title description">

  <title id="title">SpaceBrowser</title>
  <desc id="description">
    Free, cross-platform disk space explorer
  </desc>

  <defs>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffad9b"/>
      <stop offset="1" stop-color="#ee806b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe98a"/>
      <stop offset="1" stop-color="#e7b94f"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ce5ff"/>
      <stop offset="1" stop-color="#54b9dc"/>
    </linearGradient>
  </defs>

  <style>
    .title {
      fill: #1f2328;
      font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      font-size: 62px;
      font-weight: 700;
    }

    .subtitle {
      fill: #59636e;
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 25px;
      font-weight: 400;
    }

    @media (prefers-color-scheme: dark) {
      .title { fill: #f0f6fc; }
      .subtitle { fill: #9198a1; }
    }
  </style>

  <!-- Original SpaceBrowser logo -->
  <g transform="translate(14 13) scale(0.62)">
    <g>
      <rect x="10" y="10" width="132" height="132"
            fill="url(#coral)" stroke="#202020" stroke-width="8"/>
      <path d="M14 14H138V18H18V138H14Z"
            fill="#fff" opacity=".42"/>
      <path d="M138 18V138H18V134H134V18Z"
            fill="#1b1b1b" opacity=".42"/>
    </g>
    <g>
      <rect x="62" y="62" width="132" height="132"
            fill="url(#gold)" stroke="#202020" stroke-width="8"/>
      <path d="M66 66H190V70H70V190H66Z"
            fill="#fff" opacity=".42"/>
      <path d="M190 70V190H70V186H186V70Z"
            fill="#1b1b1b" opacity=".42"/>
    </g>
    <g>
      <rect x="114" y="114" width="132" height="132"
            fill="url(#blue)" stroke="#202020" stroke-width="8"/>
      <path d="M118 118H242V122H122V242H118Z"
            fill="#fff" opacity=".42"/>
      <path d="M242 122V242H122V238H238V122Z"
            fill="#1b1b1b" opacity=".42"/>
    </g>
  </g>

  <!-- Title and subtitle -->
  <text x="205" y="89" class="title">SpaceBrowser</text>
  <text x="207" y="132" class="subtitle">
    Free, cross-platform disk space explorer
  </text>

</svg>
